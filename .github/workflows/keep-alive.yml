# Keep-alive del backend en Render (plan Free: se apaga tras ~15 min sin uso
# y el primer usuario del rato esperaba hasta 2 min). Un ping cada 14 min
# lo mantiene despierto. Repo público -> Actions gratis e ilimitado.
name: keep-alive-backend

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch: # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /ping
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://fidelyfood-backend-api.onrender.com/ping)
          echo "ping -> HTTP $code"
          # 000 = no llegó a responder; avisamos en el log para revisarlo
          test "$code" = "200"
