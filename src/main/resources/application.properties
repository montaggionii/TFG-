# ===============================
# Nombre de la aplicación
# ===============================
spring.application.name=proyectoTFG
server.port=8081
# ===============================
# Configuración de MySQL (XAMPP)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/proyectoTFG?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Configuración JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# Logs (debug útil para desarrollo)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springdoc=DEBUG

# ===============================
# (Opcional) Base path API
# ===============================
