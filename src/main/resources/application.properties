spring.application.name=SpringBoot_TFG

server.port=8081
app.base-url=http://localhost:8081
app.jwt.secret=${APP_JWT_SECRET:fidelyfood-dev-jwt-secret-change-me-2026}
app.admin.email=${APP_ADMIN_EMAIL:admin@fidelyfood.local}
app.admin.password=${APP_ADMIN_PASSWORD:change-me-admin-password}
app.seed.restaurant.password=${APP_SEED_RESTAURANT_PASSWORD:change-me-restaurant-password}

spring.datasource.url=jdbc:mysql://localhost:3306/proyectoTFG?useSSL=false&serverTimezone=Europe/Madrid&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.web.resources.static-locations=file:uploads/,classpath:/static/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.com.zaxxer.hikari=WARN
