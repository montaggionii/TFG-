# ===============================
# Nombre de la aplicación
# ===============================
spring.application.name=proyectoTFG
server.port=8081
app.base-url=${APP_BASE_URL:http://localhost:8081}
app.jwt.secret=${APP_JWT_SECRET:fidelyfood-dev-jwt-secret-change-me-2026}
# ===============================
# Configuración de MySQL (MySQL local vía Homebrew)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/proyectoTFG?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:fidelyfood_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Subida de ficheros (fotos de perfil / restaurante)
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===============================
# Configuración JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# Logs (debug útil para desarrollo)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springdoc=DEBUG

