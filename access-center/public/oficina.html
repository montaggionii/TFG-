<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Oficina de Agentes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  /* Layout: mapa 3D central; al elegir un departamento se abren el resumen (izquierda) y las tareas (derecha). */
  :root { color-scheme:dark; --bg:#14151f; --panel:#262838; --panel2:#1d1f2d; --line:#3b3e55; --ink:#eceaf3; --muted:#9a9db5; --gold:#e3b84a; --ok:#6fd49a; --bad:#f2788a; --info:#7cb2ff; --serif:Georgia, "Times New Roman", serif; --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.4 var(--sans); display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:10px 14px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel2); flex-wrap:wrap; }
  h1 { margin:0; font:700 19px var(--serif); letter-spacing:.3px; }
  h1 small { font:600 12px var(--serif); color:var(--muted); margin-left:6px; }
  .tag { font-size:10.5px; letter-spacing:1px; text-transform:uppercase; font-weight:700; color:var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--muted); margin-right:6px; }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .badge { border:1px solid var(--gold); color:var(--gold); border-radius:999px; padding:2px 10px; font-weight:700; font-size:12px; }
  .spacer { margin-left:auto; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  a { color:var(--info); text-decoration:none; }
  button { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:5px 11px; cursor:pointer; }
  button:hover { border-color:var(--muted); }
  button:focus-visible, a:focus-visible { outline:2px solid var(--info); outline-offset:2px; }
  #stage { flex:1; min-height:0; display:grid; grid-template-columns:0 1fr 0; transition:grid-template-columns .35s; }
  #stage.sel { grid-template-columns:310px 1fr 340px; }
  aside { background:var(--panel2); overflow:auto; min-width:0; }
  #left { border-right:1px solid var(--line); } #right { border-left:1px solid var(--line); }
  #stage:not(.sel) aside { visibility:hidden; }
  .box { margin:12px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .box h2 { margin:0 0 6px; font:700 17px var(--serif); }
  .box h3 { margin:0 0 8px; font:700 15px var(--serif); }
  .kv { display:flex; justify-content:space-between; gap:12px; padding:3px 0; border-top:1px solid var(--line); }
  .kv:first-of-type { border-top:0; } .kv b { font-variant-numeric:tabular-nums; text-align:right; min-width:0; overflow-wrap:anywhere; }
  .trio { display:flex; justify-content:space-between; gap:6px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:11px; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); }
  .trio b { color:var(--ink); font-size:14px; margin-left:4px; }
  .wait { margin-top:8px; text-align:center; border:1px solid var(--gold); color:var(--gold); border-radius:8px; padding:5px; font-weight:700; letter-spacing:.5px; }
  .mono { font:11.5px ui-monospace, Menlo, monospace; color:var(--muted); }
  .row { display:flex; gap:8px; align-items:center; padding:5px 0; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .row .grow { flex:1; min-width:0; overflow-wrap:anywhere; }
  .pill { font-size:10.5px; font-weight:700; letter-spacing:.5px; border:1px solid currentColor; border-radius:999px; padding:1px 8px; white-space:nowrap; }
  .p-work { color:var(--ok); } .p-idle { color:var(--muted); } .p-wait { color:var(--gold); }
  .s-TODO { color:var(--muted); } .s-IN_PROGRESS { color:var(--info); } .s-REVIEW { color:var(--gold); } .s-DONE { color:var(--ok); } .s-BLOCKED { color:var(--bad); }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .tabs button { font-size:11px; padding:3px 9px; border-radius:999px; }
  .tabs button.on { background:var(--ink); color:#15161f; border-color:var(--ink); font-weight:700; }
  .empty { color:var(--muted); padding:6px 0; }
  .task { border-top:1px solid var(--line); padding:6px 0; }
  .task:first-of-type { border-top:0; }
  .task .head { display:flex; gap:8px; align-items:center; cursor:pointer; border-radius:6px; }
  .task .head:focus-visible { outline:2px solid var(--info); outline-offset:2px; }
  .task .more { margin:6px 0 2px; display:grid; gap:6px; font-size:12px; }
  .task .more dt { font-size:10px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .task .more dd { margin:0; overflow-wrap:anywhere; }
  .cmd { display:flex; gap:8px; align-items:center; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  .cmd code { flex:1; min-width:0; font:11px ui-monospace, Menlo, monospace; overflow-wrap:anywhere; user-select:all; }
  .cmd button { padding:2px 8px; font-size:11px; }
  .link-row { cursor:pointer; } .link-row:hover { background:rgba(255,255,255,.04); }
  #view { position:relative; min-width:0; min-height:0; overflow:hidden; background:radial-gradient(900px 600px at 50% 45%, #25283d, var(--bg)); }
  #gl { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  #gl.drag { cursor:grabbing; }
  #overlay { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .card { position:absolute; left:0; top:0; width:158px; background:rgba(42,44,64,.94); border:1px solid #4a4d6a; border-radius:12px; padding:8px 10px; pointer-events:auto; cursor:pointer; will-change:transform; }
  .card:hover { border-color:var(--ink); }
  .card .t { display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; }
  .card .t i { width:9px; height:9px; border-radius:50%; flex:none; }
  .card .n { text-align:center; font:700 26px var(--serif); line-height:1.1; margin-top:2px; }
  .card .l { text-align:center; font-size:8.5px; letter-spacing:1px; color:var(--muted); text-transform:uppercase; }
  .card .s { display:flex; justify-content:space-between; font-size:9.5px; color:var(--muted); margin-top:5px; }
  .card .s b { color:var(--ink); }
  .card .w { margin-top:6px; text-align:center; border:1px solid var(--gold); color:var(--gold); border-radius:7px; font-size:9px; font-weight:800; letter-spacing:.4px; padding:2px; }
  .lbl { position:absolute; left:0; top:0; padding:1px 8px; font-size:10px; font-weight:700; background:#3c3f58; border:1px solid #575a78; border-radius:999px; white-space:nowrap; will-change:transform; }
  .lbl.hot { border-color:var(--ok); } .lbl.warn { border-color:var(--gold); color:var(--gold); }
  .brain { position:absolute; left:0; top:0; padding:3px 11px; font-size:10.5px; font-weight:800; letter-spacing:.5px; background:#2f3148; border:1px solid #575a78; border-radius:999px; white-space:nowrap; will-change:transform; }
  #zoom { position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column; gap:8px; z-index:2; }
  #zoom button { width:38px; height:38px; border-radius:50%; font-size:18px; padding:0; }
  #notice { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); background:rgba(38,40,56,.95); border:1px solid var(--line); border-radius:10px; padding:8px 14px; color:var(--muted); max-width:min(640px,calc(100% - 100px)); text-align:center; z-index:2; }
  #sim { border-color:var(--gold); color:var(--gold); }
  #sim.on { background:var(--gold); color:#15161f; font-weight:700; }
  @media (max-width:900px) {
    #stage, #stage.sel { grid-template-columns:1fr; grid-template-rows:1fr; }
    #stage.sel { grid-template-rows:46% 27% 27%; }
    #stage.sel #view { order:-1; } #stage.sel #left { border-right:0; border-top:1px solid var(--line); } #stage.sel #right { border-left:0; border-top:1px solid var(--line); }
    #stage:not(.sel) aside { display:none; }
    #stage.sel { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Oficina de Agentes<small>· FidelyFood</small></h1>
  <span class="tag"><span id="dot" class="dot"></span><span id="agent">Sin datos</span></span>
  <span class="badge" id="appr" hidden></span>
  <div class="spacer">
    <button id="sim" hidden>Simular actividad</button>
    <button id="home" hidden>← Resumen</button>
    <a id="jarvis" href="/jarvis.html">Jarvis</a>
    <span class="tag" id="clock"></span>
  </div>
</header>
<div id="stage">
  <aside id="left"></aside>
  <div id="view">
    <canvas id="gl" role="img" aria-label="Oficina 3D con los departamentos del agente"></canvas>
    <div id="overlay"></div>
    <div id="zoom"><button id="zin" aria-label="Acercar">+</button><button id="zout" aria-label="Alejar">−</button><button id="zhome" aria-label="Vista general">⌂</button></div>
    <div id="notice" hidden></div>
  </div>
  <aside id="right"></aside>
</div>
<script>
const $ = (id) => document.getElementById(id);
const h = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
const ACTIVE_MS = 90_000;
// Instantánea del repositorio (solo la inyecta la vista previa publicada); en el access-center real es undefined.
const SNAP = window.OFICINA_SNAPSHOT || null;

// Departamentos = áreas de trabajo del Agent Layer. Cada puesto agrupa herramientas reales
// (MCP de FidelyFood y herramientas nativas de Claude Code).
const DEPTS = [
  { id: "codigo", name: "Código", color: 0x3f9f86, desc: "Lee, busca y modifica el repositorio y ejecuta comandos de la lista segura.", areas: ["frontend", "architecture", "documentation"],
    desks: [
      { name: "Lectura", tools: ["read_file", "list_files", "Read", "Glob"] },
      { name: "Búsqueda", tools: ["search_code", "Grep"] },
      { name: "Edición", tools: ["write_file", "Edit", "Write", "NotebookEdit"] },
      { name: "Proyecto", tools: ["inspect_project", "inspect_architecture"] },
      { name: "Terminal", tools: ["run_command", "Bash"] } ] },
  { id: "backend", name: "Backend y API", color: 0x4f7fd0, desc: "Inspecciona y llama a la API, revisa logs, levanta servicios y compila con Maven.", areas: ["backend", "api", "security", "deployment"],
    desks: [
      { name: "API", tools: ["inspect_api", "inspect_endpoint", "call_api"] },
      { name: "Logs", tools: ["inspect_logs"] },
      { name: "Servicios", tools: ["service_status", "service_start", "service_stop"] },
      { name: "Maven", tools: ["run_maven"] } ] },
  { id: "datos", name: "Base de datos", color: 0x7b57c9, desc: "Esquema y consultas de solo lectura; las escrituras exigen aprobación humana.", areas: ["database"],
    desks: [
      { name: "Esquema", tools: ["inspect_database", "inspect_schema"] },
      { name: "Consultas", tools: ["query_database", "explain_query"] },
      { name: "Escrituras", tools: ["execute_database_statement"] } ] },
  { id: "qa", name: "QA y tests", color: 0xc15a6e, desc: "Tests unitarios, de integración y E2E con Playwright.", areas: ["testing", "qa"],
    desks: [
      { name: "Unitarios", tools: ["run_unit_tests", "run_integration_tests"] },
      { name: "E2E", tools: ["run_playwright"] },
      { name: "npm", tools: ["run_npm"] } ] },
  { id: "git", name: "Git y GitHub", color: 0xb2a04a, desc: "Estado, ramas y commits en ramas agent/*; consulta de GitHub.", areas: ["git"],
    desks: [
      { name: "Estado y diff", tools: ["git_status", "git_diff", "git_log", "git_branch"] },
      { name: "Ramas y commits", tools: ["git_create_branch", "git_commit"] },
      { name: "GitHub", tools: ["github_*"] } ] },
  { id: "memoria", name: "Tareas y memoria", color: 0xd08a3a, desc: "Cola de tareas AGT-xxx, memoria persistente y skills por área.", areas: ["memory", "agent"],
    desks: [
      { name: "Tareas", tools: ["task_*", "TaskCreate", "TaskUpdate", "TaskList"] },
      { name: "Memoria", tools: ["memory_*"] },
      { name: "Skills", tools: ["list_skills", "read_skill", "Skill"] },
      { name: "Estado", tools: ["agent_status"] } ] },
];
const STATES = [["ALL", "Todas"], ["IN_PROGRESS", "En curso"], ["TODO", "Pendientes"], ["REVIEW", "En revisión"], ["BLOCKED", "Bloqueadas"], ["DONE", "Hechas"]];
const STATE_LABEL = { TODO: "PENDIENTE", IN_PROGRESS: "EN CURSO", REVIEW: "REVISIÓN", DONE: "HECHA", BLOCKED: "BLOQUEADA" };
const hex = (n) => "#" + n.toString(16).padStart(6, "0");

const normTool = (t) => String(t || "").replace(/^mcp__fidelyfood__/, "");
const toolMatches = (tool, p) => (p.endsWith("*") ? tool.startsWith(p.slice(0, -1)) : tool === p);
const deptOfTool = (tool) => DEPTS.findIndex((d) => d.desks.some((k) => k.tools.some((p) => toolMatches(tool, p))));
const deptOfArea = (area) => { const i = DEPTS.findIndex((d) => d.areas.includes(area)); return i < 0 ? 0 : i; };

let data = null, selected = null, filter = "ALL", stats = [];

function ago(ts) {
  const s = Math.max(0, Math.round((Date.now() - new Date(ts)) / 1000));
  if (s < 60) return `hace ${s} s`;
  if (s < 3600) return `hace ${Math.round(s / 60)} min`;
  return `hace ${Math.round(s / 3600)} h`;
}

// Estadísticas derivadas SOLO de los datos recibidos.
function compute() {
  const now = Date.now();
  const out = DEPTS.map((d) => ({ dept: d, calls: 0, active: 0, pending: 0, denied: 0, feed: [], tasks: [], desks: d.desks.map((k) => ({ ...k, calls: 0, last: 0, waiting: false, working: false })) }));
  const today = data ? data.today : "";
  for (const a of data ? data.activity : []) {
    const tool = normTool(a.tool); const di = deptOfTool(tool); if (di < 0) continue;
    const st = out[di]; const t = new Date(a.ts).getTime();
    const k = st.desks.find((x) => x.tools.some((p) => toolMatches(tool, p)));
    st.feed.push({ ts: a.ts, tool, file: a.file, decision: a.decision });
    if (String(a.ts).startsWith(today)) { st.calls++; k.calls++; }
    if (a.decision === "deny") st.denied++;
    if (t > k.last) k.last = t;
  }
  for (const p of data ? data.pendingApprovals : []) {
    const tool = normTool(p.tool); const di = deptOfTool(tool); if (di < 0) continue;
    out[di].pending++; const k = out[di].desks.find((x) => x.tools.some((q) => toolMatches(tool, q))); if (k) k.waiting = true;
  }
  for (const t of data ? data.tasks : []) out[deptOfArea(t.area)].tasks.push(t);
  for (const st of out) { st.desks.forEach((k) => { k.working = now - k.last < ACTIVE_MS; if (k.working) st.active++; }); st.feed.sort((a, b) => String(b.ts).localeCompare(String(a.ts))); }
  return out;
}

// --- Escena 3D ----------------------------------------------------------
const canvas = $("gl"), overlay = $("overlay");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x14151f, 60, 120);
const camera = new THREE.PerspectiveCamera(28, 1, 1, 300);
scene.add(new THREE.HemisphereLight(0xdfe3ff, 0x2a2a3a, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(-18, 34, 22); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -34, right: 34, top: 34, bottom: -34, near: 1, far: 100 }); sun.shadow.bias = -0.0004;
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), new THREE.MeshStandardMaterial({ color: 0x1b1c2a, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const box = (w, hh, d, color, parent, x = 0, y = 0, z = 0, shadow = true) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, hh, d), new THREE.MeshStandardMaterial({ color, roughness: 0.85 }));
  m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
};

const R = 15.5, PS = 9, PH = 0.7;
const platforms = [], pickables = [], deskRefs = [];
const warnTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d");
  g.fillStyle = "#e3b84a"; g.beginPath(); g.moveTo(64, 8); g.lineTo(120, 116); g.lineTo(8, 116); g.closePath(); g.fill();
  g.fillStyle = "#14151f"; g.fillRect(58, 44, 12, 40); g.fillRect(58, 92, 12, 12); return new THREE.CanvasTexture(c); })();

function buildDesk(parent, color, lx, lz) {
  const g = new THREE.Group(); g.position.set(lx, PH, lz); parent.add(g);
  box(1.9, 0.09, 0.95, 0xd9c9a3, g, 0, 0.78, 0);
  [[-0.85, -0.4], [0.85, -0.4], [-0.85, 0.4], [0.85, 0.4]].forEach(([x, z]) => box(0.08, 0.78, 0.08, 0x2b2c3c, g, x, 0.39, z));
  box(0.9, 0.55, 0.06, 0x0f1019, g, 0, 1.3, -0.28);
  box(0.12, 0.3, 0.1, 0x0f1019, g, 0, 0.98, -0.28);
  const screenMat = new THREE.MeshBasicMaterial({ color: 0x2a2d44 });
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.45), screenMat); screen.position.set(0, 1.3, -0.245); g.add(screen);
  const chair = new THREE.Group(); chair.position.set(0, 0, 0.95); g.add(chair);
  box(0.7, 0.08, 0.7, 0x4b4e63, chair, 0, 0.5, 0); box(0.7, 0.6, 0.08, 0x4b4e63, chair, 0, 0.88, 0.34); box(0.08, 0.5, 0.08, 0x2b2c3c, chair, 0, 0.25, 0);
  const worker = new THREE.Group(); worker.position.set(0, 0, 0.85); g.add(worker);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.3, 0.62, 16), new THREE.MeshStandardMaterial({ color: 0x7d8096, roughness: 0.8 })); body.position.y = 0.95; body.castShadow = true; worker.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.23, 20, 16), new THREE.MeshStandardMaterial({ color: 0x6a4331, roughness: 0.8 })); head.position.y = 1.5; head.castShadow = true; worker.add(head);
  const arms = [-1, 1].map((s) => { const a = box(0.12, 0.12, 0.55, 0x5f6176, worker, s * 0.3, 1.02, -0.3); return a; });
  const warn = new THREE.Sprite(new THREE.SpriteMaterial({ map: warnTex, transparent: true })); warn.scale.set(0.8, 0.8, 1); warn.position.set(0, 2.2, 0); warn.visible = false; g.add(warn);
  return { group: g, screenMat, body, head, arms, warn, color, phase: Math.random() * 6 };
}

DEPTS.forEach((d, i) => {
  const ang = (Math.PI * 2 * i) / DEPTS.length + Math.PI / 6;
  const g = new THREE.Group(); g.position.set(Math.cos(ang) * R, 0, Math.sin(ang) * R); scene.add(g);
  const base = box(PS, PH, PS, d.color, g, 0, PH / 2); base.userData.i = i; pickables.push(base);
  box(PS + 0.5, 0.18, PS + 0.5, 0x0e0f17, g, 0, 0.09);
  const n = d.desks.length, cols = Math.ceil(n / 2), rows = Math.ceil(n / cols);
  deskRefs[i] = d.desks.map((k, idx) => buildDesk(g, d.color, ((idx % cols) - (cols - 1) / 2) * 2.9, (Math.floor(idx / cols) - (rows - 1) / 2) * 3.1 - (rows > 1 ? 0 : 0.2)));
  platforms.push({ g, ang, pos: g.position.clone() });
  // pasillo hacia el cerebro
  const len = R - 2.6 - PS / 2 + 0.5; const mid = (R - 2.6 + PS / 2 - 0.5) / 2 + 0;
  const c = box(len, 0.12, 1.1, 0x2a2c3d, scene, Math.cos(ang) * (2.4 + len / 2), 0.06, Math.sin(ang) * (2.4 + len / 2), false); c.rotation.y = -ang; c.castShadow = false;
});

// el cerebro
const brain = new THREE.Group(); scene.add(brain);
const brainBase = box(4.6, 0.5, 4.6, 0x464a5e, brain, 0, 0.25); brainBase.userData.i = "jarvis"; pickables.push(brainBase);
const net = new THREE.Group(); net.position.y = 2.1; brain.add(net);
const ico = new THREE.Mesh(new THREE.IcosahedronGeometry(1.25, 1), new THREE.MeshBasicMaterial({ color: 0xbfc3de, wireframe: true, transparent: true, opacity: 0.55 })); net.add(ico); ico.userData.i = "jarvis"; pickables.push(ico);
const nodes = new THREE.Points(new THREE.IcosahedronGeometry(1.25, 1), new THREE.PointsMaterial({ color: 0xe9ebff, size: 0.12 })); net.add(nodes);
brain.add(new THREE.PointLight(0xaab4ff, 0.6, 12).translateY(2.4));

// paquetes de datos que viajan al departamento activo
const packets = DEPTS.map((d, i) => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), new THREE.MeshBasicMaterial({ color: d.color })); m.visible = false; scene.add(m); return { m, t: Math.random() }; });

// --- Cámara orbital ------------------------------------------------------
const cam = { theta: 0.78, phi: 0.95, dist: 70, tx: 0, ty: 0, tz: 0 };
const goal = { ...cam };
const HOME = { theta: 0.78, phi: 0.95, dist: 70, tx: 0, ty: 0, tz: 0 };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function placeCamera() {
  const sp = Math.sin(cam.phi);

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// --- Etiquetas HTML proyectadas -------------------------------------------
const cards = DEPTS.map((d, i) => {
  const c = h("div", undefined, "card"); c.setAttribute("role", "button"); c.tabIndex = 0;
  const t = h("div", undefined, "t"); const dot = h("i"); dot.style.background = hex(d.color); t.append(dot, h("span", d.name));
  const n = h("div", "0", "n"), l = h("div", "puestos activos", "l"), s = h("div", undefined, "s"), w = h("div", undefined, "w"); w.hidden = true;

});
const lbls = deskRefs.map((arr, i) => arr.map((r, ki) => { const e = h("div", DEPTS[i].desks[ki].name, "lbl"); e.hidden = true; overlay.append(e); return e; }));
const brainLbl = h("div", "JARVIS · SIN CONECTAR", "brain"); brainLbl.style.pointerEvents = "auto"; brainLbl.style.cursor = "pointer"; brainLbl.onclick = () => select("jarvis"); overlay.append(brainLbl);
const JARVIS_STATE = { RUNNING: ["TRABAJANDO", 0x6fd49a, 2.2], CONNECTED: ["CONECTADO", 0x7cb2ff, 0.8], IDLE: ["EN ESPERA", 0xbfc3de, 0.8], BLOCKED_ON_APPROVAL: ["ESPERANDO APROBACIÓN", 0xe3b84a, 0.5], STOPPED: ["DETENIDO", 0xf2788a, 0.1] };
const jarvisState = () => { const st = data && data.jarvis && data.jarvis.status ? data.jarvis.status.agentStatus : null; return JARVIS_STATE[st] || ["SIN CONECTAR", 0x6a6d82, 0.3]; };
const v3 = new THREE.Vector3();

}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; const time = now / 1000;
  const k = reduce ? 1 : 1 - Math.pow(0.0012, dt);
  for (const key of ["theta", "phi", "dist", "tx", "ty", "tz"]) cam[key] += (goal[key] - cam[key]) * k;
  placeCamera();
  { const js = jarvisState(); ico.material.color.setHex(js[1]); nodes.material.color.setHex(js[1]); net.rotation.y += dt * js[2]; } net.position.y = 2.1 + Math.sin(time) * 0.08;
  stats.forEach((st, i) => st.desks.forEach((kd, ki) => {
    const r = deskRefs[i][ki]; const w = kd.working;
    r.screenMat.color.setHex(w ? DEPTS[i].color : 0x2a2d44);
    if (w) { const p = 0.7 + 0.3 * Math.sin(time * 5 + r.phase); r.screenMat.color.multiplyScalar(p + 0.2); }
    if (!reduce && w) {

      r.arms[0].rotation.x = Math.sin(time * 14 + r.phase) * 0.18; r.arms[1].rotation.x = Math.sin(time * 14 + r.phase + 2) * 0.18;
    } else { r.body.position.y = 0.95; r.head.position.y = 1.5; r.arms.forEach((a) => (a.rotation.x = 0)); }
    r.warn.visible = kd.waiting; if (kd.waiting) r.warn.position.y = 2.2 + Math.sin(time * 3) * 0.08;
  }));
  packets.forEach((p, i) => {
    const on = stats[i] && stats[i].active > 0 && !reduce; p.m.visible = on; if (!on) return;
    p.t = (p.t + dt * 0.35) % 1; const pl = platforms[i]; const d0 = 2.4, d1 = R - PS / 2;
    const d = d0 + (d1 - d0) * p.t; p.m.position.set(Math.cos(pl.ang) * d, 0.5, Math.sin(pl.ang) * d);
  });

  platforms.forEach((pl, i) => {
    const showCard = selected === null; cards[i].c.style.display = showCard ? "" : "none";
    if (showCard) { const out = 1 + (PS / 2 + 2.6) / R; project(pl.pos.x * out, 2.6, pl.pos.z * out, cards[i].c, 0, 0); }
    deskRefs[i].forEach((r, ki) => { const l = lbls[i][ki]; const show = selected === i; l.hidden = !show; if (show) { r.group.getWorldPosition(v3); project(v3.x, 2.55, v3.z, l); } });
  });
  project(0, 4.6, 0, brainLbl);

// --- Interacción -------------------------------------------------------------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let drag = null;
canvas.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, moved: false }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", (e) => {
  if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { drag.moved = true; canvas.classList.add("drag"); }
  if (drag.moved) { goal.theta -= dx * 0.006; goal.phi = clamp(goal.phi - dy * 0.005, 0.35, 1.35); cam.theta = goal.theta; cam.phi = goal.phi; drag.x = e.clientX; drag.y = e.clientY; }

}

// --- Datos y paneles ---------------------------------------------------------
function refresh() {
  stats = compute();
  stats.forEach((st, i) => {

    c.w.hidden = !st.pending; c.w.textContent = `⚠ ${st.pending} esperando aprobación`;
    c.c.title = `${DEPTS[i].name}: en curso ${cnt("IN_PROGRESS")}, pendientes ${cnt("TODO")}, hechas ${cnt("DONE") + cnt("REVIEW")}`;

const openTasks = new Set();

function renderJarvis() {
  const left = $("left"), right = $("right");

  right.append(b5);

function renderPanels() {
  const left = $("left"), right = $("right"); left.replaceChildren(); right.replaceChildren();

  b1.append(kvRow("Puestos activos", `${st.active} / ${st.desks.length}`), kvRow("Llamadas hoy", st.calls), kvRow("Denegadas", st.denied));

  const b3 = h("div", undefined, "box"); b3.append(h("h3", "Actividad reciente"));

async function load() {
  if (SNAP) { if (!data) data = JSON.parse(JSON.stringify(SNAP)); refresh(); return; }
  try { const r = await fetch("/api/oficina", { cache: "no-store" }); data = await r.json(); } catch { data = null; }
  refresh();
}

// Solo en la vista previa sin agente: genera llamadas ficticias para ver las animaciones.
let simTimer = null;
if (SNAP) {
  $("jarvis").hidden = true; $("sim").hidden = false;
  const pool = DEPTS.flatMap((d) => d.desks.map((k) => k.tools[0].replace("*", "status")));
  $("sim").onclick = () => {
    const on = $("sim").classList.toggle("on"); $("sim").textContent = on ? "Simulando…" : "Simular actividad";
    clearInterval(simTimer); if (!on) { data.activity = []; data.pendingApprovals = []; data.jarvis = null; refresh(); return; }
    const tick = () => { const tool = pool[Math.floor(Math.random() * pool.length)]; data.activity.push({ ts: new Date().toISOString(), tool, decision: "allow" });
      if (Math.random() < 0.12) data.pendingApprovals = [{ id: "sim", tool: "execute_database_statement" }]; else if (Math.random() < 0.2) data.pendingApprovals = [];
      const pend = data.pendingApprovals;
      data.jarvis = { hasData: true, status: { agentStatus: pend.length ? "BLOCKED_ON_APPROVAL" : "RUNNING", steps: data.activity.length, testsPassed: 0, testsFailed: 0 }, pendingApprovals: pend.map((x) => ({ ...x, id: "sim", reason: "simulado", summary: "" })), today: { calls: data.activity.length, byDecision: { allow: data.activity.length }, topTools: [] }, recentRuns: [], recentToolCalls: data.activity.slice(-10).reverse() };
      refresh(); };
    tick(); tick(); tick(); simTimer = setInterval(tick, 1800);
  };
}
setInterval(() => { $("clock").textContent = new Date().toLocaleTimeString("es-ES"); }, 1000);
if (!SNAP) setInterval(load, 3000); else setInterval(refresh, 5000);
new ResizeObserver(resize).observe($("view"));
