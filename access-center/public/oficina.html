<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Oficina de Agentes · FidelyFood</title>
<style>
  :root { --bg:#14151f; --panel:#262838; --panel2:#1d1f2d; --line:#3b3e55; --ink:#eceaf3; --muted:#9a9db5; --gold:#e3b84a; --ok:#6fd49a; --bad:#f2788a; --info:#7cb2ff; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:radial-gradient(1200px 700px at 50% 40%, #1f2133, var(--bg)); color:var(--ink); font:13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:14px; padding:10px 18px; border-bottom:1px solid var(--line); background:rgba(20,21,31,.85); flex-wrap:wrap; }
  h1 { margin:0; font:700 20px Georgia, "Times New Roman", serif; letter-spacing:.3px; }
  h1 small { font:600 12px Georgia, serif; color:var(--muted); margin-left:6px; }
  .tag { font-size:10.5px; letter-spacing:1px; text-transform:uppercase; font-weight:700; color:var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--muted); margin-right:6px; }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .badge { border:1px solid var(--gold); color:var(--gold); border-radius:999px; padding:2px 10px; font-weight:700; font-size:12px; }
  .spacer { margin-left:auto; display:flex; gap:14px; align-items:center; }
  a { color:var(--info); text-decoration:none; }
  button { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:5px 11px; cursor:pointer; }
  button:hover { border-color:var(--muted); }
  #stage { flex:1; min-height:0; display:grid; grid-template-columns:0 1fr 0; transition:grid-template-columns .35s; position:relative; }
  #stage.sel { grid-template-columns:310px 1fr 340px; }
  aside { background:rgba(29,31,45,.92); overflow:auto; padding:0; min-width:0; }
  #left { border-right:1px solid var(--line); } #right { border-left:1px solid var(--line); }
  #stage:not(.sel) aside { visibility:hidden; }
  .box { margin:12px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .box h2 { margin:0 0 6px; font:700 17px Georgia, serif; }
  .box h3 { margin:0 0 8px; font:700 15px Georgia, serif; }
  .kv { display:flex; justify-content:space-between; padding:3px 0; border-top:1px solid var(--line); }
  .kv:first-of-type { border-top:0; } .kv b { font-variant-numeric:tabular-nums; }
  .trio { display:flex; justify-content:space-between; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); }
  .trio b { color:var(--ink); font-size:14px; margin-left:4px; }
  .wait { margin-top:8px; text-align:center; border:1px solid var(--gold); color:var(--gold); border-radius:8px; padding:5px; font-weight:700; letter-spacing:.5px; }
  .lead { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 11px; margin:8px 0; color:#d9d7e6; }
  .mono { font:11.5px ui-monospace, Menlo, monospace; color:var(--muted); }
  .row { display:flex; gap:8px; align-items:center; padding:5px 0; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .row .grow { flex:1; min-width:0; overflow-wrap:anywhere; }
  .pill { font-size:10.5px; font-weight:700; letter-spacing:.5px; border:1px solid currentColor; border-radius:999px; padding:1px 8px; white-space:nowrap; }
  .p-work { color:var(--ok); } .p-idle { color:var(--muted); } .p-wait { color:var(--gold); }
  .s-TODO { color:var(--muted); } .s-IN_PROGRESS { color:var(--info); } .s-REVIEW { color:var(--gold); } .s-DONE { color:var(--ok); } .s-BLOCKED { color:var(--bad); }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .tabs button { font-size:11px; padding:3px 9px; border-radius:999px; }
  .tabs button.on { background:var(--ink); color:#15161f; border-color:var(--ink); font-weight:700; }
  .empty { color:var(--muted); padding:6px 0; }
  #map { width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  #map.drag { cursor:grabbing; }
  #zoom { position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column; gap:8px; z-index:2; }
  #zoom button { width:38px; height:38px; border-radius:50%; font-size:18px; padding:0; }
  #notice { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); background:rgba(38,40,56,.95); border:1px solid var(--line); border-radius:10px; padding:8px 14px; color:var(--muted); max-width:min(640px,90vw); text-align:center; z-index:2; }
  #notice[hidden] { display:none; }
  /* animaciones del mapa */
  @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-2.5px); } }
  @keyframes glow { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  @keyframes flow { to { stroke-dashoffset:-20; } }
  .worker { transform-box:fill-box; }
  .working .worker { animation:bob .45s ease-in-out infinite alternate; }
  .working .screen { animation:glow 1.1s ease-in-out infinite; }
  .link.active { animation:flow 1s linear infinite; }
  .plat { cursor:pointer; } .plat:hover .top { filter:brightness(1.12); }
  text { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  @media (max-width:900px) {
    #stage.sel { grid-template-columns:0 1fr 0; }
    #stage.sel aside { visibility:hidden; }
  }
  @media (prefers-reduced-motion:reduce) { .working .worker, .working .screen, .link.active { animation:none; } }
</style>
</head>
<body>
<header>
  <h1>Oficina de Agentes<small>· FidelyFood</small></h1>
  <span class="tag"><span id="dot" class="dot"></span><span id="agent">Sin datos</span></span>
  <span class="badge" id="appr" hidden></span>
  <div class="spacer">
    <button id="home" hidden>← Resumen</button>
    <a href="/jarvis.html">Jarvis</a>
    <span class="tag" id="clock"></span>
  </div>
</header>
<div id="stage">
  <aside id="left"></aside>
  <div style="position:relative;min-width:0;min-height:0">
    <svg id="map" role="img" aria-label="Oficina isométrica con los departamentos del agente"></svg>
    <div id="zoom"><button id="zin" aria-label="Acercar">+</button><button id="zout" aria-label="Alejar">−</button><button id="zhome" aria-label="Vista general">⌂</button></div>
    <div id="notice" hidden>Sin actividad todavía. Los puestos se encienden cuando el agente usa herramientas (Claude Code con los hooks o el runner del Agent Layer).</div>
  </div>
  <aside id="right"></aside>
</div>
<script>
const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; };
const h = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };

const ACTIVE_MS = 90_000;

// Departamentos = áreas de trabajo del Agent Layer. Cada puesto agrupa las
// herramientas reales (MCP de FidelyFood y herramientas nativas de Claude Code).
const DEPTS = [
  { id: "codigo", name: "Código", color: "#3f9f86", desc: "Lee, busca y modifica el repositorio y ejecuta comandos de la lista segura.", areas: ["frontend", "architecture", "documentation"],
    desks: [
      { name: "Lectura", tools: ["read_file", "list_files", "Read", "Glob"] },
      { name: "Búsqueda", tools: ["search_code", "Grep"] },
      { name: "Edición", tools: ["write_file", "Edit", "Write", "NotebookEdit"] },
      { name: "Proyecto", tools: ["inspect_project", "inspect_architecture"] },
      { name: "Terminal", tools: ["run_command", "Bash"] } ] },
  { id: "backend", name: "Backend y API", color: "#4f7fd0", desc: "Inspecciona y llama a la API, revisa logs, levanta servicios y compila con Maven.", areas: ["backend", "security", "deployment"],
    desks: [
      { name: "API", tools: ["inspect_api", "inspect_endpoint", "call_api"] },
      { name: "Logs", tools: ["inspect_logs"] },
      { name: "Servicios", tools: ["service_status", "service_start", "service_stop"] },
      { name: "Maven", tools: ["run_maven"] } ] },
  { id: "datos", name: "Base de datos", color: "#7b57c9", desc: "Esquema y consultas de solo lectura; las escrituras exigen aprobación humana.", areas: ["database"],
    desks: [
      { name: "Esquema", tools: ["inspect_database", "inspect_schema"] },
      { name: "Consultas", tools: ["query_database", "explain_query"] },
      { name: "Escrituras", tools: ["execute_database_statement"] } ] },
  { id: "qa", name: "QA y tests", color: "#c15a6e", desc: "Tests unitarios, de integración y E2E con Playwright.", areas: ["testing", "qa"],
    desks: [
      { name: "Unitarios", tools: ["run_unit_tests", "run_integration_tests"] },
      { name: "E2E", tools: ["run_playwright"] },
      { name: "npm", tools: ["run_npm"] } ] },
  { id: "git", name: "Git y GitHub", color: "#b2a04a", desc: "Estado, ramas y commits en ramas agent/*; consulta de GitHub.", areas: ["git"],
    desks: [
      { name: "Estado y diff", tools: ["git_status", "git_diff", "git_log", "git_branch"] },
      { name: "Ramas y commits", tools: ["git_create_branch", "git_commit"] },
      { name: "GitHub", tools: ["github_*"] } ] },
  { id: "memoria", name: "Tareas y memoria", color: "#d08a3a", desc: "Cola de tareas AGT-xxx, memoria persistente y skills por área.", areas: [],
    desks: [
      { name: "Tareas", tools: ["task_*", "TaskCreate", "TaskUpdate", "TaskList"] },
      { name: "Memoria", tools: ["memory_*"] },
      { name: "Skills", tools: ["list_skills", "read_skill", "Skill"] },
      { name: "Estado", tools: ["agent_status"] } ] },
];
const STATES = [["ALL", "Todas"], ["IN_PROGRESS", "En curso"], ["TODO", "Pendientes"], ["REVIEW", "En revisión"], ["BLOCKED", "Bloqueadas"], ["DONE", "Hechas"]];
const STATE_LABEL = { TODO: "PENDIENTE", IN_PROGRESS: "EN CURSO", REVIEW: "REVISIÓN", DONE: "HECHA", BLOCKED: "BLOQUEADA" };

const normTool = (t) => String(t || "").replace(/^mcp__fidelyfood__/, "");
const toolMatches = (tool, pattern) => (pattern.endsWith("*") ? tool.startsWith(pattern.slice(0, -1)) : tool === pattern);
const deptOfTool = (tool) => DEPTS.findIndex((d) => d.desks.some((k) => k.tools.some((p) => toolMatches(tool, p))));
const deptOfArea = (area) => { const i = DEPTS.findIndex((d) => d.areas.includes(area)); return i < 0 ? 0 : i; };

let data = null, selected = null, filter = "ALL";

function ago(ts) {
  const s = Math.max(0, Math.round((Date.now() - new Date(ts)) / 1000));
  if (s < 60) return `hace ${s} s`;
  if (s < 3600) return `hace ${Math.round(s / 60)} min`;
  return `hace ${Math.round(s / 3600)} h`;
}

// Estadísticas derivadas SOLO de los datos reales recibidos.
function compute() {
  const now = Date.now();
  const stats = DEPTS.map((d) => ({ dept: d, calls: 0, active: 0, pending: 0, denied: 0, feed: [], tasks: [], desks: d.desks.map((k) => ({ ...k, calls: 0, last: 0, waiting: false })) }));
  const today = data ? data.today : "";
  for (const a of data ? data.activity : []) {
    const tool = normTool(a.tool);
    const di = deptOfTool(tool); if (di < 0) continue;
    const st = stats[di]; const t = new Date(a.ts).getTime();
    const k = st.desks.find((x) => x.tools.some((p) => toolMatches(tool, p)));
    st.feed.push({ ts: a.ts, tool, file: a.file, decision: a.decision, source: a.source });
    if (String(a.ts).startsWith(today)) { st.calls++; k.calls++; }
    if (a.decision === "deny") st.denied++;
    if (t > k.last) k.last = t;
  }
  for (const p of data ? data.pendingApprovals : []) {
    const tool = normTool(p.tool); const di = deptOfTool(tool); if (di < 0) continue;
    stats[di].pending++; const k = stats[di].desks.find((x) => x.tools.some((q) => toolMatches(tool, q))); if (k) k.waiting = true;
  }
  for (const t of data ? data.tasks : []) stats[deptOfArea(t.area)].tasks.push(t);
  for (const st of stats) { st.desks.forEach((k) => { k.working = now - k.last < ACTIVE_MS; if (k.working) st.active++; }); st.feed.sort((a, b) => String(b.ts).localeCompare(String(a.ts))); }
  return stats;
}

// --- Escena isométrica -------------------------------------------------
const UX = 34, UY = 17, S = 5.2;
const iso = (cx, cy, x, y) => [cx + (x - y) * UX, cy + (x + y) * UY];
const poly = (pts) => pts.map((p) => p.join(",")).join(" ");
const shade = (hex, f) => { const n = parseInt(hex.slice(1), 16); const c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => Math.max(0, Math.min(255, Math.round(v * f)))); return `rgb(${c})`; };
const RX = 560, RY = 290;
const POS = DEPTS.map((_, i) => { const a = (Math.PI * 2 * (i - 1.5)) / DEPTS.length + Math.PI * 0.1; return [Math.cos(a) * RX, Math.sin(a) * RY]; });
const HOME = { x: -860, y: -520, w: 1720, h: 1000 };
let view = { ...HOME }, target = { ...HOME };

function drawDesk(g, cx, cy, lx, ly, k, color) {
  const dg = el("g", { class: k.working ? "working" : "" }, g);
  const W = 0.55, D = 0.32, ht = 11;
  const p = (x, y, z = 0) => { const [sx, sy] = iso(cx, cy, lx + x, ly + y); return [sx, sy - z]; };
  // escritorio
  el("polygon", { points: poly([p(-W, -D, ht), p(W, -D, ht), p(W, D, ht), p(-W, D, ht)]), fill: "#d9c9a3" }, dg);
  el("polygon", { points: poly([p(-W, D, ht), p(W, D, ht), p(W, D, 0), p(-W, D, 0)]), fill: "#a89874" }, dg);
  el("polygon", { points: poly([p(W, -D, ht), p(W, D, ht), p(W, D, 0), p(W, -D, 0)]), fill: "#8c7e5d" }, dg);
  // monitor
  const [mx, my] = p(0, -D + 0.05, ht);
  el("rect", { x: mx - 13, y: my - 20, width: 26, height: 17, rx: 2, fill: "#10111a", stroke: "#2c2e44" }, dg);
  el("rect", { class: "screen", x: mx - 11, y: my - 18, width: 22, height: 13, rx: 1, fill: k.working ? color : "#2a2d44", opacity: k.working ? 1 : .7 }, dg);
  // trabajador (de espaldas, delante del escritorio)
  const [wx, wy] = p(0, D + 0.55, 0);
  const w = el("g", { class: "worker" }, dg);
  el("ellipse", { cx: wx, cy: wy + 2, rx: 9, ry: 4, fill: "#000", opacity: .35 }, w);
  el("rect", { x: wx - 6, y: wy - 16, width: 12, height: 13, rx: 4, fill: k.working ? color : "#7d8096" }, w);
  el("circle", { cx: wx, cy: wy - 22, r: 6, fill: "#5b3a2a" }, w);
  // etiqueta
  const [lxp, lyp] = p(0, -D - 0.1, ht + 24);
  const label = el("g", {}, dg);
  const txt = el("text", { x: lxp, y: lyp, "text-anchor": "middle", "font-size": 9.5, "font-weight": 700, fill: "#eceaf3" }, label); txt.textContent = k.name;
  const bw = k.name.length * 5.6 + 14;
  label.insertBefore(el("rect", { x: lxp - bw / 2, y: lyp - 11, width: bw, height: 15, rx: 7.5, fill: "#3c3f58", stroke: "#575a78" }), txt);
  if (k.waiting) { const t = el("text", { x: lxp + bw / 2 + 3, y: lyp + 2, "font-size": 15, fill: "#e3b84a" }, label); t.textContent = "⚠"; }
  const title = el("title", {}, dg); title.textContent = `${k.name}: ${k.calls} llamadas hoy` + (k.last ? ` · última ${ago(k.last)}` : " · sin actividad");
}

function drawPlatform(svg, st, i) {
  const [cx, cy] = POS[i]; const d = st.dept;
  const g = el("g", { class: "plat", "data-i": i }, svg);
  const c = [[-S / 2, -S / 2], [S / 2, -S / 2], [S / 2, S / 2], [-S / 2, S / 2]].map(([x, y]) => iso(cx, cy, x, y));
  const T = 20; const dn = (p) => [p[0], p[1] + T];
  el("polygon", { points: poly([c[3], c[2], dn(c[2]), dn(c[3])]), fill: "#15161f" }, g);
  el("polygon", { points: poly([c[2], c[1], dn(c[1]), dn(c[2])]), fill: "#0d0e15" }, g);
  el("polygon", { class: "top", points: poly(c), fill: shade(d.color, selected === i ? 1.05 : .82), stroke: selected === i ? "#fff" : "none", "stroke-width": 2 }, g);
  const n = st.desks.length; const cols = Math.ceil(n / 2), rows = Math.ceil(n / cols);
  const spots = st.desks.map((k, idx) => ({ k, lx: (idx % cols - (cols - 1) / 2) * 1.75, ly: (Math.floor(idx / cols) - (rows - 1) / 2) * 1.9 }));
  spots.sort((a, b) => a.lx + a.ly - (b.lx + b.ly));
  spots.forEach((s) => drawDesk(g, cx, cy, s.lx, s.ly, s.k, d.color));
  // tarjeta del departamento
  const side = Math.sign(cx) || 1; const bx = cx + (Math.abs(cx) < 50 ? -84 : side * 215 - 84), by = cy - 150 + (cy > 0 ? 190 : 0);
  const card = el("g", { transform: `translate(${bx},${by})` }, g);
  el("rect", { width: 168, height: st.pending ? 120 : 98, rx: 12, fill: "#2a2c40", stroke: "#4a4d6a", opacity: .97 }, card);
  el("circle", { cx: 14, cy: 15, r: 4.5, fill: d.color }, card);
  const t1 = el("text", { x: 25, y: 19, "font-size": 10.5, "font-weight": 800, fill: "#eceaf3", "letter-spacing": .6 }, card); t1.textContent = d.name.toUpperCase();
  const t2 = el("text", { x: 84, y: 48, "text-anchor": "middle", "font-size": 26, "font-weight": 700, fill: "#fff", "font-family": "Georgia, serif" }, card); t2.textContent = st.active;
  const t3 = el("text", { x: 84, y: 60, "text-anchor": "middle", "font-size": 8.5, fill: "#9a9db5", "letter-spacing": 1 }, card); t3.textContent = "PUESTOS ACTIVOS";
  const cnt = (s) => st.tasks.filter((t) => t.state === s).length;
  const calls = el("text", { x: 12, y: 78, "font-size": 8.5, fill: "#9a9db5" }, card); calls.textContent = "LLAMADAS HOY";
  const callsN = el("text", { x: 156, y: 78, "text-anchor": "end", "font-size": 10, "font-weight": 700, fill: "#fff" }, card); callsN.textContent = st.calls;
  const trio = el("text", { x: 12, y: 92, "font-size": 7.5, fill: "#9a9db5", "letter-spacing": .5 }, card);
  trio.textContent = `EN CURSO ${cnt("IN_PROGRESS")} · PEND. ${cnt("TODO")} · HECHAS ${cnt("DONE") + cnt("REVIEW")}`;
  if (st.pending) {
    el("rect", { x: 8, y: 97, width: 152, height: 16, rx: 7, fill: "none", stroke: "#e3b84a" }, card);
    const w = el("text", { x: 84, y: 108.5, "text-anchor": "middle", "font-size": 8.5, "font-weight": 800, fill: "#e3b84a" }, card); w.textContent = `⚠ ${st.pending} ESPERANDO APROBACIÓN`;
  }
  g.addEventListener("click", () => select(i));
  return g;
}

function drawBrain(svg, notes) {
  const g = el("g", {}, svg);
  const c = [[-1.6, -1.6], [1.6, -1.6], [1.6, 1.6], [-1.6, 1.6]].map(([x, y]) => iso(0, 0, x, y));
  el("polygon", { points: poly([c[3], c[2], [c[2][0], c[2][1] + 14], [c[3][0], c[3][1] + 14]]), fill: "#2c2e3e" }, g);
  el("polygon", { points: poly([c[2], c[1], [c[1][0], c[1][1] + 14], [c[2][0], c[2][1] + 14]]), fill: "#20212f" }, g);
  el("polygon", { points: poly(c), fill: "#4a4d5e" }, g);
  const pts = Array.from({ length: 14 }, (_, i) => { const a = i * 2.4, r = 10 + (i % 5) * 13; return [Math.cos(a) * r * 1.5, Math.sin(a) * r * .75]; });
  pts.forEach((p, i) => { const q = pts[(i * 3 + 1) % pts.length]; el("line", { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: "#bfc3de", "stroke-width": .7, opacity: .7 }, g); });
  pts.forEach((p) => el("circle", { cx: p[0], cy: p[1], r: 2, fill: "#e4e6f6" }, g));
  const pill = el("g", { transform: "translate(0,-62)" }, g);
  el("rect", { x: -64, y: -12, width: 128, height: 22, rx: 11, fill: "#2f3148", stroke: "#575a78" }, pill);
  const t = el("text", { x: 0, y: 3, "text-anchor": "middle", "font-size": 10.5, "font-weight": 800, fill: "#eceaf3", "letter-spacing": .5 }, pill); t.textContent = `EL CEREBRO · ${notes} NOTAS`;
}

function render() {
  const stats = compute();
  const svg = $("map"); svg.replaceChildren();
  const links = el("g", {}, svg);
  stats.forEach((st, i) => { const [x, y] = POS[i]; el("path", { class: "link" + (st.active ? " active" : ""), d: `M0,0 Q${x / 2},${y / 2 - 40} ${x},${y}`, fill: "none", stroke: st.active ? DEPTS[i].color : "#4a4d68", "stroke-width": 1.5, "stroke-dasharray": "5 6", opacity: .8 }, links); });
  drawBrain(svg, data ? data.brainNotes : 0);
  // de atrás hacia delante
  stats.map((st, i) => i).sort((a, b) => POS[a][1] - POS[b][1]).forEach((i) => drawPlatform(svg, stats[i], i));

  const a = data && data.agentStatus ? data.agentStatus.agentStatus : null;
  $("agent").textContent = a ? a : "Sin datos del agente";
  $("dot").className = "dot" + (a && a !== "STOPPED" ? " on" : "");
  const pend = data ? data.pendingApprovals.length : 0;
  $("appr").hidden = !pend; $("appr").textContent = `⚠ ${pend} esperando aprobación`;
  $("notice").hidden = !data || data.activity.length > 0;
  renderPanels(stats);
}

function renderPanels(stats) {
  const left = $("left"), right = $("right");
  left.replaceChildren(); right.replaceChildren();
  if (selected === null) return;
  const st = stats[selected], d = st.dept;
  const cnt = (s) => st.tasks.filter((t) => t.state === s).length;

  const b1 = h("div", undefined, "box");
  b1.append(h("h2", d.name), h("div", d.desc, "mono"));
  const kv = (l, v) => { const r = h("div", undefined, "kv"); r.append(h("span", l), h("b", String(v))); return r; };
  b1.append(kv("Puestos activos", `${st.active} / ${st.desks.length}`), kv("Llamadas hoy", st.calls), kv("Denegadas", st.denied));
  const trio = h("div", undefined, "trio");
  [["En curso", cnt("IN_PROGRESS")], ["Pendientes", cnt("TODO")], ["Hechas", cnt("DONE") + cnt("REVIEW")]].forEach(([l, v]) => { const s = h("span", l); s.append(h("b", String(v))); trio.append(s); });
  b1.append(trio);
  if (st.pending) b1.append(h("div", `⚠ ${st.pending} esperando aprobación humana`, "wait"));
  left.append(b1);

  const b2 = h("div", undefined, "box"); b2.append(h("h3", "Puestos"));
  st.desks.forEach((k) => {
    const r = h("div", undefined, "row"); const g = h("div", undefined, "grow");
    g.append(h("div", k.name), h("div", k.tools.join(", "), "mono"));
    const state = k.waiting ? ["APROBACIÓN", "p-wait"] : k.working ? ["TRABAJANDO", "p-work"] : ["LIBRE", "p-idle"];
    r.append(g, h("span", state[0], "pill " + state[1])); b2.append(r);
  });
  left.append(b2);

  const b3 = h("div", undefined, "box"); b3.append(h("h3", "Actividad reciente"));
  if (!st.feed.length) b3.append(h("div", "Sin actividad registrada de este departamento.", "empty"));
  st.feed.slice(0, 12).forEach((f) => {
    const r = h("div", undefined, "row"); const g = h("div", undefined, "grow");
    g.append(h("div", f.tool), h("div", [ago(f.ts), f.file ? f.file.split("/").slice(-2).join("/") : null, f.decision].filter(Boolean).join(" · "), "mono"));
    r.append(g); b3.append(r);
  });
  left.append(b3);

  const b4 = h("div", undefined, "box"); b4.append(h("h3", `Tareas · ${d.name}`));
  const tabs = h("div", undefined, "tabs");
  STATES.forEach(([key, label]) => {
    const n = key === "ALL" ? st.tasks.length : cnt(key);
    const bt = h("button", `${label} ${n}`); if (key === filter) bt.className = "on";
    bt.onclick = () => { filter = key; renderPanels(stats); }; tabs.append(bt);
  });
  b4.append(tabs);
  const list = st.tasks.filter((t) => filter === "ALL" || t.state === filter);
  if (!list.length) b4.append(h("div", st.tasks.length ? "Ninguna tarea en este estado." : "Sin tareas para este departamento en AGENT_TASKS.md.", "empty"));
  list.forEach((t) => {
    const r = h("div", undefined, "row"); const g = h("div", undefined, "grow");
    g.append(h("div", t.title), h("div", `${t.id} · ${t.priority || "—"}`, "mono"));
    r.append(g, h("span", STATE_LABEL[t.state] || t.state, "pill s-" + t.state)); b4.append(r);
  });
  right.append(b4);
}

// --- Cámara -------------------------------------------------------------
function applyView() { $("map").setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`); }
function tick() {
  for (const k of ["x", "y", "w", "h"]) view[k] += (target[k] - view[k]) * 0.18;
  applyView(); requestAnimationFrame(tick);
}
function fit(box) { const r = $("map").getBoundingClientRect(); const ar = r.width / Math.max(1, r.height); let { x, y, w, h: hh } = box; if (w / hh < ar) { const nw = hh * ar; x -= (nw - w) / 2; w = nw; } else { const nh = w / ar; y -= (nh - hh) / 2; hh = nh; } return { x, y, w, h: hh }; }
function zoomBy(f) { const cx = target.x + target.w / 2, cy = target.y + target.h / 2; target = { x: cx - target.w * f / 2, y: cy - target.h * f / 2, w: target.w * f, h: target.h * f }; }
function select(i) {
  selected = i; filter = "ALL"; $("stage").classList.toggle("sel", i !== null); $("home").hidden = i === null;
  if (i === null) target = fit(HOME);
  else { const [x, y] = POS[i]; target = fit({ x: x - 330, y: y - 230, w: 660, h: 420 }); }
  render();
}
$("home").onclick = () => select(null); $("zhome").onclick = () => select(null);
$("zin").onclick = () => zoomBy(0.75); $("zout").onclick = () => zoomBy(1.33);
$("map").addEventListener("wheel", (e) => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 0.9 : 1.1); }, { passive: false });
let drag = null;
$("map").addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, moved: false }; });
window.addEventListener("pointermove", (e) => {
  if (!drag) return; const r = $("map").getBoundingClientRect(); const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { drag.moved = true; $("map").classList.add("drag"); }
  if (drag.moved) { const k = target.w / r.width; target.x -= dx * k; target.y -= dy * k; view.x = target.x; view.y = target.y; drag.x = e.clientX; drag.y = e.clientY; }
});
window.addEventListener("pointerup", () => { $("map").classList.remove("drag"); setTimeout(() => (drag = null), 0); });
$("map").addEventListener("click", (e) => { if (drag && drag.moved) e.stopPropagation(); }, true);

async function load() {
  try { const r = await fetch("/api/oficina", { cache: "no-store" }); data = await r.json(); }
  catch { data = null; }
  render();
}
setInterval(() => { $("clock").textContent = new Date().toLocaleTimeString("es-ES"); }, 1000);
setInterval(load, 3000);
window.addEventListener("resize", () => { target = selected === null ? fit(HOME) : target; });
target = fit(HOME); view = { ...target }; applyView(); requestAnimationFrame(tick); load();
</script>
</body>
</html>
